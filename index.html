<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boolet - Update Required</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #04080f; --card: #070d1c; --purple: #a855f7; --cyan: #00e5ff;
    --yellow: #ffe020; --text: #e8d8ff; --muted: #5a4a7a;
    --mono: 'Share Tech Mono', monospace; --display: 'Orbitron', sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--mono);
    overflow-x: hidden; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1.5rem 1.2rem;
  }
  canvas#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .card {
    position: relative; z-index: 1; max-width: 480px; width: 100%;
    max-height: 100vh; overflow-y: auto;
    background: var(--card); border: 1px solid rgba(168,85,247,0.25);
    border-radius: 8px; padding: 1.8rem 1.8rem; text-align: center;
  }
  .eyebrow {
    font-size: 0.62rem; letter-spacing: 0.32em; color: var(--purple);
    text-transform: uppercase; margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--display); font-weight: 900; font-size: clamp(1.15rem, 5vw, 2.1rem);
    color: var(--text); line-height: 1.15; margin-bottom: 0.8rem;
  }
  p {
    font-size: 0.8rem; color: var(--muted); line-height: 1.6; margin-bottom: 0.8rem;
  }
  .date {
    color: var(--yellow);
  }
  .btn {
    display: inline-block; margin-top: 0.3rem; padding: 0.65rem 1.6rem;
    font-family: var(--mono); font-size: 0.73rem; letter-spacing: 0.1em;
    text-transform: uppercase; text-decoration: none; border-radius: 4px;
    background: var(--purple); color: #fff; font-weight: 700; transition: all 0.18s;
  }
  .btn:hover {
    background: transparent; color: var(--purple); outline: 2px solid var(--purple);
    box-shadow: 0 0 18px rgba(168,85,247,0.35);
  }
  .btn-group {
    display: inline-flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center;
  }
  .btn-ghost {
    background: transparent; color: var(--cyan); outline: 2px solid var(--cyan);
  }
  .btn-ghost:hover { background: var(--cyan); color: #000; box-shadow: none; }
  .thanks {
    margin-top: 1rem; font-size: 0.7rem; color: var(--cyan);
  }
  /* landscape phones: short viewport height */
  @media (max-height: 480px) and (orientation: landscape) {
    body { padding: 0.8rem 1rem; align-items: flex-start; }
    .card {
      padding: 1rem 1.5rem;
      display: grid; grid-template-columns: 1fr auto; column-gap: 1.5rem; row-gap: 0.3rem;
      align-items: center; text-align: left; max-width: 640px;
    }
    .eyebrow { grid-column: 1 / -1; margin-bottom: 0.2rem; }
    h1 { grid-column: 1; font-size: clamp(1rem, 3.2vw, 1.4rem); margin-bottom: 0.4rem; }
    p { grid-column: 1; font-size: 0.72rem; margin-bottom: 0.4rem; line-height: 1.4; }
    .btn-group { grid-column: 2; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 0.5rem; }
    .btn { margin: 0; white-space: nowrap; display: block; text-align: center; }
    .btn-ghost { margin-left: 0; }
    .thanks { grid-column: 1 / -1; margin-top: 0.4rem; font-size: 0.65rem; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="card">
  <div class="eyebrow">// Interplanetary Studios</div>
  <h1>This Version of Boolet Is Obsolete</h1>
  <p>This version will no longer be updated. Please update the game from the Google Play Store on and after <span class="date">9/27/2026</span>.</p>
  <div class="btn-group">
    <a class="btn" href="https://play.google.com/store/apps/details?id=co.median.android.krobelk" target="_blank" rel="noopener">Open Google Play</a>
    <a class="btn btn-ghost" href="boolet.html">Play Anyway</a>
  </div>
  <p class="thanks">Thank you for playtesting Boolet, hope you enjoy the upcoming update!</p>
</div>
<script>
(function () {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  function init() {
    stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.3 + 0.2,
        speed: Math.random() * 0.003 + 0.002,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.15 ? 270 : 210
      });
    }
  }
  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const a = 0.15 + 0.55 * Math.abs(Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue},60%,85%,${a})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { resize(); init(); });
  resize(); init();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
